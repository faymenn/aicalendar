services:
  app:
    container_name: aicalendar-app-prod
    image: faymenn/aitodolist:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env

  frontend:
    container_name: aicalendar-frontend-prod
    image: faymenn/aitodolist-frontend:latest
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api
    ports:
      - "127.0.0.1:3000:3000"